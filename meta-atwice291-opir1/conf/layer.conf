# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-atwice291-opir1"
BBFILE_PATTERN_meta-atwice291-opir1 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-atwice291-opir1 = "6"

LAYERDEPENDS_meta-atwice291-opir1 = "core"
LAYERSERIES_COMPAT_meta-atwice291-opir1 = "kirkstone"
